# k8s/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventhub-api
  namespace: eventhub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.eventhub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eventhub-api
            port:
              number: 8000

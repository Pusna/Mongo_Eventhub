[pytest]
testpaths = tests
# корень проекта в sys.path, чтобы "import app" работал и у `pytest`, и у `python -m pytest`
pythonpath = .
addopts = -ra --cov=app --cov-report=term-missing
markers =
    sharding: потрібен шардований кластер (docker compose --profile sharding up -d)
    failover: зупиняє контейнер mongo-primary; запуск лише з RUN_FAILOVER=1
    slow: довгі тести (вибори primary, навантаження)
filterwarnings =
    ignore::DeprecationWarning:gridfs.*
